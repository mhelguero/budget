<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6f5c">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>Budget</title>
<style>
  :root {
    --bg:#f4f6f5; --card:#fff; --text:#1c2321; --muted:#6b7773; --track:#e3e9e7;
    --ok:#2e9e6e; --warn:#e0a020; --over:#d6453d; --accent:#1f6f5c; --line:#dfe5e3;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111514; --card:#1b2120; --text:#eef2f0; --muted:#93a09b; --track:#2a3331; --line:#2a3331; --accent:#3fb28f; }
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--text);
    font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif; }
  header { padding:18px 20px 8px; display:flex; justify-content:space-between; align-items:center; }
  header h1 { font-size:22px; margin:0; }
  header button { background:none; border:none; font-size:22px; color:var(--accent); padding:6px; }
  main { padding:0 16px 110px; max-width:560px; margin:0 auto; }
  .tab { display:none; } .tab.active { display:block; }
  .card { background:var(--card); border-radius:16px; padding:14px 16px; margin:10px 0;
    box-shadow:0 1px 3px rgba(0,0,0,.08); }
  .row { display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
  .name { font-weight:600; text-transform:capitalize; }
  .sub { color:var(--muted); font-size:13px; }
  .track { height:12px; background:var(--track); border-radius:99px; overflow:hidden; margin:10px 0 8px; }
  .fill { height:100%; border-radius:99px; transition:width .5s; }
  .left { font-weight:700; font-size:15px; }
  .ok{color:var(--ok)} .warn{color:var(--warn)} .over{color:var(--over)}
  .bg-ok{background:var(--ok)} .bg-warn{background:var(--warn)} .bg-over{background:var(--over)}
  .total { border:2px solid var(--accent); }
  label { display:block; font-size:13px; color:var(--muted); margin:14px 0 6px; }
  input,select { width:100%; font-size:18px; padding:14px; border-radius:12px; color:var(--text);
    border:1px solid var(--line); background:var(--card); }
  .btn { width:100%; margin-top:20px; padding:16px; font-size:18px; font-weight:700; border:none;
    border-radius:14px; background:var(--accent); color:#fff; }
  .btn.alt { background:var(--track); color:var(--text); margin-top:10px; }
  .btn.danger { background:none; color:var(--over); margin-top:6px; font-size:16px; }
  .btn:disabled { opacity:.6; }
  nav { position:fixed; bottom:0; left:0; right:0; display:flex; background:var(--card);
    border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom,0px); }
  nav button { flex:1; padding:12px 0 10px; background:none; border:none; font-size:12px;
    color:var(--muted); display:flex; flex-direction:column; align-items:center; gap:2px; }
  nav button span { font-size:22px; }
  nav button.active { color:var(--accent); font-weight:700; }
  .overlay { position:fixed; inset:0; background:rgba(0,0,0,.5); display:none;
    align-items:center; justify-content:center; padding:24px; z-index:10; overflow:auto; }
  .overlay.show { display:flex; }
  .dialog { background:var(--card); border-radius:18px; padding:22px; width:100%; max-width:380px; }
  .dialog h2 { margin:0 0 6px; font-size:20px; }
  .msg { text-align:center; color:var(--muted); padding:40px 0; }
  .err { color:var(--over); text-align:center; margin-top:12px; }
  .banner { background:rgba(224,160,32,.15); border:1px solid var(--warn); border-radius:12px;
    padding:10px 12px; font-size:13px; margin:10px 0; }
  .day { font-size:13px; font-weight:700; color:var(--muted); margin:18px 4px 4px; text-transform:uppercase; letter-spacing:.04em; }
  .pay { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:14px 16px;
    background:var(--card); border-radius:14px; margin:6px 0; }
  .pay .amt { font-weight:700; white-space:nowrap; }
  .pay .cat { font-weight:600; text-transform:capitalize; }
  .pay .note { color:var(--muted); font-size:13px; margin-top:2px; overflow:hidden; text-overflow:ellipsis; }
  .paytotal { display:flex; justify-content:space-between; padding:6px 4px; font-weight:700; }
</style>
</head>
<body>
<header>
  <h1 id="title">This month</h1>
  <button id="refreshBtn" onclick="refresh()" aria-label="Refresh">&#8635;</button>
</header>

<main>
  <section id="home" class="tab active">
    <div id="list"><div class="msg">Loading…</div></div>
    <div class="sub" id="ver" style="text-align:center;margin-top:16px"></div>
  </section>

  <section id="add" class="tab">
    <label for="amount">Amount spent</label>
    <input id="amount" type="number" inputmode="decimal" step="0.01" placeholder="0.00">
    <label for="cat">Category</label>
    <select id="cat"></select>
    <label for="note">Note (optional)</label>
    <input id="note" type="text" placeholder="e.g. amazon">
    <label for="date">Date</label>
    <input id="date" type="date">
    <button class="btn" id="submit" onclick="submitExpense()">Add expense</button>
    <div class="err" id="err"></div>
  </section>

  <section id="pay" class="tab">
    <div id="payBanner"></div>
    <div id="payList"><div class="msg">Loading…</div></div>
  </section>
</main>

<nav>
  <button id="nav-home" class="active" onclick="show('home')"><span>&#128202;</span>Home</button>
  <button id="nav-add" onclick="show('add')"><span>&#10133;</span>Add payment</button>
  <button id="nav-pay" onclick="show('pay')"><span>&#128203;</span>Payments</button>
</nav>

<div class="overlay" id="setup">
  <div class="dialog">
    <h2>One-time setup</h2>
    <label for="cfgUrl">Web app URL (ends in /exec)</label>
    <input id="cfgUrl" type="url" placeholder="https://script.google.com/macros/s/.../exec">
    <label for="cfgKey">Passphrase</label>
    <input id="cfgKey" type="password" placeholder="your secret passphrase">
    <button class="btn" onclick="saveSetup()">Save</button>
    <div class="err" id="cfgErr"></div>
  </div>
</div>

<div class="overlay" id="dlg">
  <div class="dialog">
    <h2>Added &#10003;</h2>
    <div class="sub" id="dlgInfo"></div>
    <button class="btn alt" onclick="more()">Add another</button>
    <button class="btn" onclick="done()">I'm done</button>
  </div>
</div>

<div class="overlay" id="editDlg">
  <div class="dialog">
    <h2>Edit payment</h2>
    <label for="eAmount">Amount</label>
    <input id="eAmount" type="number" inputmode="decimal" step="0.01">
    <label for="eCat">Category</label>
    <select id="eCat"></select>
    <label for="eNote">Note</label>
    <input id="eNote" type="text">
    <label for="eDate">Date</label>
    <input id="eDate" type="date">
    <button class="btn" id="eSave" onclick="saveEdit()">Save changes</button>
    <button class="btn alt" onclick="closeEdit()">Cancel</button>
    <button class="btn danger" id="eDelete" onclick="deleteEdit()">Delete payment</button>
    <div class="err" id="eErr"></div>
  </div>
</div>

<script>
  const APP_VERSION = 7;
  let backendVersion = '?';
  let data = null, payments = null, current = 'home', editing = null;
  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const money = n => (n < 0 ? '-' : '') + '$' + Math.abs(n).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
  function today() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  const TITLES = { home:'This month', add:'Add a payment', pay:'Payments' };

  function where(e) { const l = String(e && e.stack || '').split('\n').slice(1, 3).map(x => x.trim().replace(/^at /, '')).join(' | '); return l ? '<div class="sub" style="margin-top:8px;word-break:break-all">' + esc(l) + '</div>' : ''; }
  // ---------- API ----------
  const cfg = () => ({ url: localStorage.getItem('b_url'), key: localStorage.getItem('b_key') });
  async function call(opts) {
    const { url, key } = cfg();
    let r;
    if (opts.body) {
      r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(Object.assign({ key: key }, opts.body)) });
    } else {
      r = await fetch(url + '?key=' + encodeURIComponent(key) + (opts.query ? '&' + opts.query : ''));
    }
    const d = await r.json();
    if (d.error) throw new Error(d.error);
    backendVersion = d.version || 'old';
    $('ver').textContent = 'App v' + APP_VERSION + ' · Backend v' + backendVersion;
    return d;
  }

  // ---------- navigation ----------
  function show(tab) {
    if (tab === 'add' && current !== 'add') $('date').value = today();
    current = tab;
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.id === tab));
    ['home','add','pay'].forEach(t => $('nav-' + t).classList.toggle('active', t === tab));
    $('title').textContent = TITLES[tab];
    $('refreshBtn').style.visibility = tab === 'add' ? 'hidden' : 'visible';
    if (tab === 'pay') loadPayments();
    window.scrollTo(0, 0);
  }
  function refresh() { current === 'pay' ? loadPayments() : load(); }

  // ---------- setup ----------
  function saveSetup() {
    const u = $('cfgUrl').value.trim(), k = $('cfgKey').value.trim();
    if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(u) || !k) { $('cfgErr').textContent = 'Enter the /exec URL and your passphrase.'; return; }
    localStorage.setItem('b_url', u); localStorage.setItem('b_key', k);
    $('setup').classList.remove('show'); load();
  }

  // ---------- home ----------
  function level(pct) { return pct > 100 ? 'over' : pct >= 80 ? 'warn' : 'ok'; }
  function card(name, budget, spent, extra) {
    const left = budget - spent;
    const pct = budget > 0 ? (spent / budget) * 100 : (spent > 0 ? 101 : 0);
    const lv = level(pct);
    const leftTxt = left >= 0 ? money(left) + ' left' : money(-left) + ' over budget';
    return '<div class="card ' + (extra || '') + '">' +
      '<div class="row"><span class="name">' + esc(name) + '</span>' +
      '<span class="sub">' + money(spent) + ' of ' + money(budget) + '</span></div>' +
      '<div class="track"><div class="fill bg-' + lv + '" style="width:' + Math.min(pct, 100) + '%"></div></div>' +
      '<div class="row"><span class="left ' + lv + '">' + leftTxt + '</span>' +
      '<span class="sub">' + Math.round(pct) + '%</span></div></div>';
  }
  function render() {
    if (!data) return;
    const cats = data.categories;
    const t = data.total || { budget: cats.reduce((a, c) => a + c.budget, 0), spent: cats.reduce((a, c) => a + c.spent, 0) };
    $('list').innerHTML = card('Total', t.budget, t.spent, 'total') + cats.map(c => card(c.name, c.budget, c.spent)).join('');
    const opts = cats.map(c => '<option>' + esc(c.name) + '</option>').join('');
    const sel = $('cat'), cur = sel.value;
    sel.innerHTML = opts; if (cur) sel.value = cur;
  }
  function load() {
    if (!cfg().url) { $('setup').classList.add('show'); return; }
    $('list').innerHTML = '<div class="msg">Loading…</div>';
    call({}).then(d => { data = d; render(); })
      .catch(e => {
        $('list').innerHTML = '<div class="msg err">Couldn\'t load: ' + esc(e.message) + where(e) +
          '<br><br><button class="btn alt" onclick="localStorage.clear();load()">Re-enter setup</button></div>';
      });
  }

  // ---------- add payment ----------
  function submitExpense() {
    const amount = parseFloat($('amount').value);
    $('err').textContent = '';
    if (!(amount > 0)) { $('err').textContent = 'Enter an amount.'; return; }
    const category = $('cat').value;
    if (!category) { $('err').textContent = 'Pick a category.'; return; }
    $('submit').disabled = true; $('submit').textContent = 'Saving…';
    call({ body: { action: 'add', items: [{ amount: amount, category: category, note: $('note').value, date: $('date').value || undefined }] } })
      .then(d => {
        data = d; render(); payments = null;
        $('submit').disabled = false; $('submit').textContent = 'Add expense';
        const c = d.categories.find(x => x.name === category);
        if (c) { const left = c.budget - c.spent;
          $('dlgInfo').textContent = category + ': ' + (left >= 0 ? money(left) + ' left this month' : money(-left) + ' over budget'); }
        $('dlg').classList.add('show');
      })
      .catch(e => {
        $('submit').disabled = false; $('submit').textContent = 'Add expense';
        $('err').textContent = 'Save failed: ' + e.message;
      });
  }
  function more() { $('dlg').classList.remove('show'); $('amount').value = ''; $('note').value = ''; $('amount').focus(); }
  function done() { $('dlg').classList.remove('show'); $('amount').value = ''; $('note').value = ''; show('home'); }

  // ---------- payments ----------
  function dayLabel(ymd) {
    if (!ymd) return 'No date';
    const p = ymd.split('-');
    return new Date(+p[0], +p[1] - 1, +p[2]).toLocaleDateString('en-US', { weekday:'short', month:'short', day:'numeric' });
  }
  function loadPayments() {
    if (!cfg().url) { $('setup').classList.add('show'); return; }
    $('payList').innerHTML = '<div class="msg">Loading…</div>';
    call({ query: 'action=payments' }).then(d => {
      if (!d || !Array.isArray(d.payments)) {
        throw new Error('The backend answered without a payments list (it sent: ' + Object.keys(d || {}).join(', ') +
          '; backend v' + (d && d.version || 'old') + ', app v' + APP_VERSION + '). Paste the latest Code.gs into Apps Script and deploy a New version.');
      }
      payments = d; renderPayments();
    }).catch(e => { $('payList').innerHTML = '<div class="msg err">Couldn\'t load: ' + esc(e.message) + where(e) + '</div>'; });
  }
  function renderPayments() {
    if (!payments) return;
    $('payBanner').innerHTML = payments.limitWarning
      ? '<div class="banner">Your sheet\'s Spending formulas only count rows 16 to 86. Extend them to row 500 so new payments keep counting.</div>' : '';
    const list = payments.payments;
    if (!list.length) { $('payList').innerHTML = '<div class="msg">No payments yet this month.</div>'; return; }
    const total = list.reduce((a, p) => a + p.amount, 0);
    let html = '<div class="paytotal"><span>' + list.length + ' payments</span><span>' + money(total) + '</span></div>', lastDay = null;
    list.forEach((p, i) => {
      if (p.effectiveDate !== lastDay) { html += '<div class="day">' + esc(dayLabel(p.effectiveDate)) + '</div>'; lastDay = p.effectiveDate; }
      html += '<div class="pay" onclick="openEdit(' + i + ')"><div style="min-width:0"><div class="cat">' + esc(p.category) + '</div>' +
        (p.note ? '<div class="note">' + esc(p.note) + '</div>' : '') + '</div><div class="amt">' + money(p.amount) + '</div></div>';
    });
    $('payList').innerHTML = html;
  }
  function openEdit(i) {
    const p = payments.payments[i]; editing = p;
    $('eAmount').value = p.amount; $('eNote').value = p.note; $('eDate').value = p.effectiveDate || '';
    const names = (data ? data.categories.map(c => c.name) : []);
    if (names.indexOf(p.category) < 0) names.push(p.category);
    $('eCat').innerHTML = names.map(n => '<option>' + esc(n) + '</option>').join('');
    $('eCat').value = p.category; $('eErr').textContent = '';
    $('editDlg').classList.add('show');
  }
  function closeEdit() { $('editDlg').classList.remove('show'); editing = null; }
  function afterEdit(d) { data = d; render(); closeEdit(); $('eSave').disabled = false; $('eDelete').disabled = false; loadPayments(); }
  function editFail(e) { $('eSave').disabled = false; $('eDelete').disabled = false; $('eErr').textContent = e.message; }
  function saveEdit() {
    const amount = parseFloat($('eAmount').value);
    if (!(amount > 0)) { $('eErr').textContent = 'Enter an amount.'; return; }
    $('eSave').disabled = true; $('eDelete').disabled = true;
    const body = { action: 'update', row: editing.row, expected: { category: editing.category, amount: editing.amount },
      category: $('eCat').value, amount: amount, note: $('eNote').value };
    if ($('eDate').value && $('eDate').value !== editing.effectiveDate) body.date = $('eDate').value;
    call({ body: body }).then(afterEdit).catch(editFail);
  }
  function deleteEdit() {
    if (!confirm('Delete this payment?')) return;
    $('eSave').disabled = true; $('eDelete').disabled = true;
    call({ body: { action: 'delete', row: editing.row, expected: { category: editing.category, amount: editing.amount } } })
      .then(afterEdit).catch(editFail);
  }

  $('date').value = today();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
  load();
</script>
</body>
</html>
